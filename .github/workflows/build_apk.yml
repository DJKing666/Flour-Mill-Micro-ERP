name: Build Flour Mill POS APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean Build Workspace
        run: flutter clean

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Patch legacy jcenter in downloaded packages
        run: find ~/.pub-cache/ -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

      - name: Patch legacy compileSdkVersion in downloaded packages
        run: |
          find ~/.pub-cache/ -name "build.gradle" -exec sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 34/g' {} +
          find ~/.pub-cache/ -name "build.gradle" -exec sed -i -E 's/compileSdk [0-9]+/compileSdk 34/g' {} +

      - name: Create Dummy Directories to Satisfy Gradle Cache
        run: |
          mkdir -p build/unified_esc_pos_printer/intermediates/aar_metadata_check/release/checkReleaseAarMetadata
          mkdir -p build/usb_serial/intermediates/aar_metadata_check/release/checkReleaseAarMetadata

      # Removed the invalid --build-arg flag. The mkdir step above handles the Gradle error.
      - name: Compile Release APK
        run: flutter build apk --release --no-pub --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_TAG="pos-v1.0.${{ github.run_number }}-$(date +'%Y%m%d%H%M')"
          
          gh release create "$BUILD_TAG" build/app/outputs/flutter-apk/app-release.apk \
            --title "MillFlow POS - v1.0.${{ github.run_number }}" \
            --notes "Release build for Rugtek BP02 thermal printer integration. Compiled automatically via GitHub Actions."